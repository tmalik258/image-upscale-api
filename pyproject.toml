[project]
name = "image-upscale-api"
version = "1.0.0"
description = "Asynchronous image upscaling with Real-ESRGAN or HAT"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.140.13",
    "httpx==0.28.1",
    "numpy==2.5.1",
    "pillow==12.3.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "python-multipart==0.0.32",
    "spandrel==0.4.2",
    "uvicorn[standard]==0.52.0",
]

[project.optional-dependencies]
cpu = [
    "torch==2.13.0",
]
cuda = [
    "torch==2.13.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
]

[tool.uv]
package = false
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cuda" },
    ],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "cuda", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
